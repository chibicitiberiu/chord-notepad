name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'nightly'
        type: choice
        options:
          - nightly
          - test
          - release

# Read-only by default; the jobs that write (releases, the changelog push,
# nightly cleanup) ask for contents: write themselves.
permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for version detection

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth libfluidsynth3

      # Pinned to the pipenv that wrote Pipfile.lock: newer ones hash the Pipfile
      # differently, call the lock out of date and re-lock to newer packages.
      # sync installs exactly the lock and never re-locks, so the builds and the
      # licence inventory (tests/test_licences.py) see the same versions.
      - name: Install pipenv
        run: pip install pipenv==2025.0.4

      - name: Install dependencies
        run: pipenv sync --dev

      - name: Run tests
        run: pipenv run pytest tests/ -v

      # Both editions of the User Guide must build without warnings (e.g. a
      # screenshot missing for one edition). docs/HELP_AUTHORING.md.
      - name: Check the User Guide (desktop and Android editions)
        run: |
          pipenv run sphinx-build -q -W --keep-going -t desktop -b html help "$RUNNER_TEMP/help-desktop"
          pipenv run sphinx-build -q -W --keep-going -t android -b html help "$RUNNER_TEMP/help-android"

  check-changes:
    name: Check for Recent Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for commits in last week
        id: check
        run: |
          # For manual workflow dispatch, always build
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Manual workflow dispatch - building"
          else
            # Check if there are commits in the last 7 days
            COMMITS=$(git log --since="7 days ago" --oneline | wc -l)
            if [ "$COMMITS" -gt 0 ]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "Found $COMMITS commits in the last week"
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "No commits in the last week"
            fi
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: [test, check-changes]
    # id-token: write is needed for the OIDC login used by Windows code signing.
    # No GITHUB_TOKEN writes here (the snap upload uses its own credential).
    permissions:
      contents: read
      id-token: write
    # Ties the OIDC token's subject to a stable value
    # (repo:<owner>/<repo>:environment:release) so the Azure federated credential
    # can match every release with one entry, instead of a per-tag subject.
    # Do NOT add required-reviewer protection rules to this environment, or it
    # will gate nightly/dispatch builds too.
    environment: release
    # Run build only for nightly (if changes), tag push, or manual workflow dispatch
    if: |
      always() &&
      needs.test.result == 'success' &&
      (
        (github.event_name == 'schedule' && needs.check-changes.outputs.has_changes == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.check-changes.outputs.has_changes == 'true') ||
        startsWith(github.ref, 'refs/tags/v')
      )
    strategy:
      # Let every platform finish, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ChordNotepad-linux
            asset_name: ChordNotepad-linux-x64
          - os: windows-latest
            artifact_name: ChordNotepad-windows
            asset_name: ChordNotepad-windows-x64.exe
          - os: macos-latest
            artifact_name: ChordNotepad-macos
            asset_name: ChordNotepad-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history for version info

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth libfluidsynth3

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install fluid-synth

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Download FluidSynth for Windows
          $version = "2.3.4"
          $url = "https://github.com/FluidSynth/fluidsynth/releases/download/v$version/fluidsynth-$version-win10-x64.zip"
          $zipPath = "$env:TEMP\fluidsynth.zip"
          $extractPath = "$env:GITHUB_WORKSPACE\fluidsynth"

          # Pinned: the licence inventory (resources/licenses/components.json)
          # lists exactly this package's DLLs, and the release's source bundle
          # carries this exact zip. tests/test_licences.py keeps the two in step.
          $sha256 = "e12ec080379c8a0e470c1e7cd1e067b9a1eb938b3deb7e2f7874bd835017cb8a"

          Write-Host "Downloading FluidSynth $version..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $got = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLower()
          if ($got -ne $sha256) { throw "FluidSynth zip SHA-256 is $got, expected $sha256" }

          Write-Host "Extracting to $extractPath..."
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          # Find the bin directory (it's inside a versioned folder)
          $binPath = Get-ChildItem -Path $extractPath -Recurse -Directory -Filter "bin" | Select-Object -First 1
          Write-Host "FluidSynth bin path: $($binPath.FullName)"

          # Set environment variable for subsequent steps
          echo "FLUIDSYNTH_PATH=$($binPath.FullName)" >> $env:GITHUB_ENV

          # List contents for debugging
          Get-ChildItem -Path $binPath.FullName

      - name: Install pipenv
        run: pip install pipenv==2025.0.4

      - name: Install dependencies
        run: pipenv sync --dev

      - name: Build HTML documentation
        run: |
          pipenv run sphinx-build -b html help help/build/html
          echo "HTML documentation built for bundling"

      - name: Generate icon files
        shell: bash
        run: |
          # ImageMagick's built-in SVG renderer (used on Linux and macOS)
          # paints the icon's linked gradient black, so the PNGs come from
          # librsvg there. The Windows ImageMagick renders it correctly.
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get install -y imagemagick librsvg2-bin
            MAGICK_CMD="convert"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install imagemagick librsvg
            MAGICK_CMD="magick"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            # The Windows image already ships ImageMagick.
            command -v magick >/dev/null || choco install imagemagick -y
            MAGICK_CMD="magick"
          fi

          cd resources
          if command -v rsvg-convert >/dev/null; then
            for size in 16 32 48 64 128 256; do
              rsvg-convert -w $size -h $size chord-notepad-icon.svg -o icon-$size.png
            done
            $MAGICK_CMD icon-256.png icon-128.png icon-64.png icon-48.png icon-32.png icon-16.png chord-notepad-icon.ico
            rm icon-16.png icon-48.png icon-64.png
          else
            # Generate PNG icons at different sizes with transparency
            $MAGICK_CMD -background none -density 300 chord-notepad-icon.svg -resize 32x32 -quality 100 icon-32.png
            $MAGICK_CMD -background none -density 300 chord-notepad-icon.svg -resize 128x128 -quality 100 icon-128.png
            $MAGICK_CMD -background none -density 600 chord-notepad-icon.svg -resize 256x256 -quality 100 icon-256.png

            # Generate .ico file for Windows with transparency
            $MAGICK_CMD -background none -density 600 chord-notepad-icon.svg -define icon:auto-resize=256,128,64,48,32,16 chord-notepad-icon.ico
          fi

          # Fail the build instead of shipping a black icon again: the pad's
          # centre pixel must be the pink gradient, not black.
          pipenv run python -c "
          import sys
          from PIL import Image
          for name in ('icon-32.png', 'icon-128.png', 'icon-256.png'):
              im = Image.open(name).convert('RGB')
              pixel = im.getpixel((im.width // 2, im.height // 2))
              print(name, pixel)
              if pixel[0] < 150:
                  sys.exit(f'{name}: centre pixel {pixel} is not the pink pad; the SVG rendered wrong')
          "

          echo "Generated icon files:"
          ls -lh icon-*.png chord-notepad-icon.ico

      - name: Generate build info
        shell: bash
        run: |
          BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
          BUILD_NUMBER="${{ github.run_number }}"
          COMMIT_HASH=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Determine version + build type based on trigger
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Legacy tag-push release path
            VERSION="$GITHUB_REF_NAME"
            BUILD_TYPE="release"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.build_type }}" == "release" ]]; then
            VERSION="v${BASE_VERSION} build ${BUILD_NUMBER} (${COMMIT_SHORT})"
            BUILD_TYPE="release"
          else
            VERSION="v${BASE_VERSION} nightly $(date +%Y%m%d) (${COMMIT_SHORT})"
            BUILD_TYPE="nightly"
          fi

          # Create build_info.py
          cat > src/build_info.py << EOF
          """
          Auto-generated build information
          This file is generated during the build process and should not be edited manually.
          """

          BASE_VERSION = "$BASE_VERSION"
          BUILD_NUMBER = "$BUILD_NUMBER"
          VERSION = "$VERSION"
          BUILD_TYPE = "$BUILD_TYPE"
          COMMIT_HASH = "$COMMIT_HASH"
          COMMIT_SHORT = "$COMMIT_SHORT"
          BUILD_DATE = "$BUILD_DATE"
          EOF

          echo "Generated build_info.py:"
          cat src/build_info.py

          # Generate PyInstaller version_info.txt for Windows exe properties.
          # FileVersion/ProductVersion must be a 4-tuple of integers. We parse
          # BASE_VERSION (e.g. "0.1") into "MAJOR.MINOR.0.BUILD_NUMBER".
          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          FILEVER="(${MAJOR}, ${MINOR}, ${PATCH}, ${BUILD_NUMBER})"

          cat > version_info.txt << EOF
          # UTF-8
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=${FILEVER},
              prodvers=${FILEVER},
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable(
                  '040904B0',
                  [
                    StringStruct('CompanyName', 'Tiberiu Chibici'),
                    StringStruct('FileDescription', 'Chord Notepad'),
                    StringStruct('FileVersion', '${VERSION}'),
                    StringStruct('InternalName', 'ChordNotepad'),
                    StringStruct('LegalCopyright', '(c) 2025-2026 Tiberiu Chibici. GNU AGPL-3.0'),
                    StringStruct('OriginalFilename', 'ChordNotepad.exe'),
                    StringStruct('ProductName', 'Chord Notepad'),
                    StringStruct('ProductVersion', '${VERSION}')
                  ])
              ]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          EOF

          echo "Generated version_info.txt:"
          cat version_info.txt

      # The spec checks every bundled file against the licence inventory;
      # strict makes a file without a licence entry fail the build.
      - name: Build with PyInstaller
        env:
          CHORD_NOTEPAD_LICENCE_CHECK: strict
        run: pipenv run pyinstaller --clean chord-notepad.spec

      - name: Prepare artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          mv ChordNotepad ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Move-Item ChordNotepad.exe ${{ matrix.asset_name }}

      # --- Code signing (Windows) -------------------------------------------
      # Sign the final .exe with Azure Trusted Signing so Windows stops flagging
      # it as an unknown publisher (SmartScreen) and WDAC machines stop blocking
      # it. The signing key lives in Azure's HSM; the runner only requests a
      # signature over OIDC (no stored secret). Both steps no-op until the
      # TRUSTED_SIGNING_* repo variables and the OIDC signing identity are set
      # up, so unconfigured builds and forks still succeed.
      - name: Azure login (OIDC)
        if: runner.os == 'Windows' && vars.TRUSTED_SIGNING_ACCOUNT != '' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executable (Azure Trusted Signing)
        if: runner.os == 'Windows' && vars.TRUSTED_SIGNING_ACCOUNT != '' && startsWith(github.ref, 'refs/tags/v')
        uses: Azure/artifact-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 90

      # The Ubuntu packages whose libraries the Linux binary bundles (written
      # by the spec), for the release's source bundle. The snap's manifest is
      # added below.
      - name: Collect licence data (Linux binary)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/licence-data
          cp build/chord-notepad/licenses-system/system.json dist/licence-data/linux-system.json \
            || echo "::warning::The spec listed no system packages for the Linux binary"

      # --- Snap (Linux) ------------------------------------------------------
      # Built with snapcraft in LXD from snap/snapcraft.yaml (core26), before the
      # Flatpak so its build caches aren't copied into the snap's build. Kept as
      # a workflow artifact; published to the Snap Store when the
      # SNAPCRAFT_STORE_CREDENTIALS secret is set (tags -> stable, else edge).
      # Snapcraft is called directly: snapcore/action-* still run on Node 20.
      - name: Install snapcraft
        if: runner.os == 'Linux'
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          # Docker's firewall rules drop traffic from the LXD bridge otherwise
          sudo iptables -P FORWARD ACCEPT
          sudo snap install snapcraft --classic

      # SNAPCRAFT_BUILD_INFO=1 puts snap/manifest.yaml (the staged Ubuntu
      # packages and their versions) into the snap: the Licences window and
      # the source bundle read it. sudo resets the environment, so it goes in
      # the command.
      - name: Build snap
        if: runner.os == 'Linux'
        run: make snap SNAPCRAFT="sudo SNAPCRAFT_BUILD_INFO=1 snapcraft"

      - name: Collect licence data (snap)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/licence-data
          rm -rf "$RUNNER_TEMP/snap-root"
          if unsquashfs -q -n -d "$RUNNER_TEMP/snap-root" dist/ChordNotepad-linux-x64.snap snap/manifest.yaml usr/share/doc \
              && [ -f "$RUNNER_TEMP/snap-root/snap/manifest.yaml" ]; then
            cp "$RUNNER_TEMP/snap-root/snap/manifest.yaml" dist/licence-data/snap-manifest.yaml
            # The staged packages' copyright files: their licences decide which
            # Ubuntu source packages the source bundle carries (GPL and LGPL).
            for f in "$RUNNER_TEMP"/snap-root/usr/share/doc/*/copyright; do
              [ -f "$f" ] || continue
              pkg=$(basename "$(dirname "$f")")
              mkdir -p "dist/licence-data/snap-doc/$pkg"
              cp -L "$f" "dist/licence-data/snap-doc/$pkg/copyright"
            done
          else
            echo "::warning::The snap has no snap/manifest.yaml; its Ubuntu source packages won't be listed"
          fi

      - name: Upload licence data
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: licence-data
          path: dist/licence-data/
          retention-days: 90

      - name: Smoke-test snap
        if: runner.os == 'Linux'
        run: make snap-check

      - name: Upload snap
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ChordNotepad-snap
          path: dist/ChordNotepad-linux-x64.snap
          retention-days: 90

      - name: Publish snap
        if: runner.os == 'Linux'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge' }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::notice::SNAPCRAFT_STORE_CREDENTIALS not set; snap built but not published"
            exit 0
          fi
          snapcraft upload --release="$CHANNEL" dist/ChordNotepad-linux-x64.snap

      # --- Flatpak bundle (Linux) -------------------------------------------
      # Built from source by packaging/flatpak/*.yml (not from the PyInstaller
      # binary) and exported as a single-file bundle that pulls the runtime
      # from Flathub on install. Reuses the docs, icons and build_info.py the
      # steps above generated.
      - name: Install flatpak-builder
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache flatpak-builder state
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packaging/flatpak/.flatpak-builder
          key: flatpak-${{ hashFiles('packaging/flatpak/*.yml', 'packaging/flatpak/*.json') }}-${{ github.sha }}
          restore-keys: flatpak-${{ hashFiles('packaging/flatpak/*.yml', 'packaging/flatpak/*.json') }}-

      - name: Build Flatpak bundle
        if: runner.os == 'Linux'
        run: make flatpak

      - name: Smoke-test Flatpak bundle
        if: runner.os == 'Linux'
        run: make flatpak-check

      - name: Upload Flatpak bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ChordNotepad-flatpak
          path: dist/ChordNotepad-linux-x64.flatpak
          retention-days: 90

      # --- Microsoft Store package (Windows) --------------------------------
      # The paid Store listing ships the same app as an MSIX built from a onedir
      # PyInstaller build. The .msix stays a workflow artifact (uploaded to
      # Partner Center by hand) and is never attached to the GitHub release.
      # Runs on tag pushes and manual dispatches, not scheduled nightlies.
      # STORE_* repo variables come from Partner Center > Product identity;
      # without them the package gets a placeholder identity that works for
      # local sideload tests but that Partner Center will reject.
      - name: Build Store package (MSIX)
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          CHORD_NOTEPAD_ONEDIR: '1'
          CHORD_NOTEPAD_LICENCE_CHECK: strict
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME }}
        run: |
          pipenv run pyinstaller --clean --noconfirm --distpath dist-store --workpath build-store chord-notepad.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $identity = $env:STORE_IDENTITY_NAME
          $publisher = $env:STORE_PUBLISHER
          $publisherName = $env:STORE_PUBLISHER_DISPLAY_NAME
          if (-not $identity -or -not $publisher -or -not $publisherName) {
            # Only a release build is meant for Partner Center, so only warn there.
            $level = if ($env:GITHUB_REF -like 'refs/tags/v*') { 'warning' } else { 'notice' }
            Write-Host "::${level}::STORE_* repo variables not set; building MSIX with a placeholder identity (not uploadable to the Store)."
            $identity = 'ChordNotepad.Unreserved'
            $publisher = 'CN=ChordNotepadUnreserved'
            $publisherName = 'Chord Notepad Contributors'
          }
          # Must equal the name reserved in Partner Center.
          $displayName = if ($env:STORE_DISPLAY_NAME) { $env:STORE_DISPLAY_NAME } else { 'Chord Notepad' }

          $version = (Get-Content VERSION -Raw).Trim()
          ./packaging/msix/build_msix.ps1 `
            -AppDir dist-store/ChordNotepad `
            -OutFile "dist-store/ChordNotepad-$version-x64.msix" `
            -Version $version `
            -IdentityName $identity `
            -Publisher $publisher `
            -PublisherDisplayName $publisherName `
            -DisplayName $displayName

          "MSIX_PATH=dist-store/ChordNotepad-$version-x64.msix" >> $env:GITHUB_ENV
          "MSIX_IDENTITY=$identity" >> $env:GITHUB_ENV
          "MSIX_PUBLISHER=$publisher" >> $env:GITHUB_ENV

      - name: Upload Store package
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ChordNotepad-store-msix
          path: dist-store/*.msix
          retention-days: 90

      # Install the package on the runner and check the app starts inside it.
      # Signs a throwaway copy with a self-signed cert; the uploaded artifact
      # stays unsigned for Partner Center.
      - name: Smoke-test Store package
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          ./packaging/msix/smoke_test.ps1 `
            -Package $env:MSIX_PATH `
            -IdentityName $env:MSIX_IDENTITY `
            -Publisher $env:MSIX_PUBLISHER

  build-pdf-docs:
    name: Build PDF Documentation
    needs: [test]
    runs-on: ubuntu-latest
    # Build PDF only for full releases (tag push or manual release dispatch)
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install pipenv
        run: pip install pipenv==2025.0.4

      - name: Install dependencies
        run: pipenv sync --dev

      - name: Build PDF documentation
        run: |
          pipenv run sphinx-build -b rinoh help help/build/rinoh
          echo "PDF documentation built"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: documentation-pdf
          path: help/build/rinoh/*.pdf
          retention-days: 90

  create-release:
    name: Create Release
    needs: [build, build-pdf-docs, check-changes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only run if it's a tag push or scheduled nightly with changes or manual dispatch
    # PDF job is optional (only runs for releases), so we check for success OR skipped
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.build-pdf-docs.result == 'success' || needs.build-pdf-docs.result == 'skipped') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'schedule' && needs.check-changes.outputs.has_changes == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.check-changes.outputs.has_changes == 'true')
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # Source offer (resources/licenses/SOURCE-OFFER.txt): the app's own
      # source, and the source of the LGPL/GPL/MPL components every desktop
      # build bundles, attached to the release next to the binaries.
      - name: Cache third-party sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/licence-sources
          key: licence-sources-${{ hashFiles('resources/licenses/components.json') }}

      - name: Build source bundles
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')
          mkdir -p artifacts/sources
          python3 android/tools/make_source_tarball.py \
            --out "artifacts/sources/ChordNotepad-${VERSION}-source.tar.gz" --prefix "ChordNotepad-${VERSION}"
          # The Ubuntu source packages of the GPL and LGPL libraries in the
          # Linux binary and the snap go into the bundle (--fetch-ubuntu=gpl);
          # the rest are listed with their Launchpad URLs.
          ARGS=(--fetch-ubuntu=gpl)
          [ -f artifacts/licence-data/linux-system.json ] && ARGS+=(--system-json artifacts/licence-data/linux-system.json)
          [ -f artifacts/licence-data/snap-manifest.yaml ] && ARGS+=(--snap-manifest artifacts/licence-data/snap-manifest.yaml)
          [ -d artifacts/licence-data/snap-doc ] && ARGS+=(--snap-docs artifacts/licence-data/snap-doc)
          python3 packaging/licenses/make_source_bundle.py \
            --out "artifacts/sources/ChordNotepad-${VERSION}-third-party-sources.tar" "${ARGS[@]}"
          ls -l artifacts/sources

      - name: Determine release info
        id: release_info
        run: |
          BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
          BUILD_NUMBER="${{ github.run_number }}"
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          IS_FULL_RELEASE=false

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Legacy tag-push release path
            VERSION="$GITHUB_REF_NAME"
            RELEASE_NAME="Release $VERSION"
            IS_PRERELEASE=false
            TAG_NAME="$VERSION"
            IS_FULL_RELEASE=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.build_type }}" == "release" ]]; then
            VERSION="v${BASE_VERSION} build ${BUILD_NUMBER} (${COMMIT_SHORT})"
            RELEASE_NAME="Chord Notepad v${BASE_VERSION} (build ${BUILD_NUMBER})"
            IS_PRERELEASE=false
            TAG_NAME="v${BASE_VERSION}-build${BUILD_NUMBER}"
            IS_FULL_RELEASE=true
          else
            VERSION="v${BASE_VERSION} nightly $(date +%Y%m%d) (${COMMIT_SHORT})"
            RELEASE_NAME="Nightly Build $(date +%Y-%m-%d)"
            IS_PRERELEASE=true
            TAG_NAME="nightly-$(date +%Y%m%d)"
          fi

          # Build the release body: optional changelog notes + standard footer.
          # CHANGELOG.md feeds full releases; nightlies get a generic note.
          CHANGES_SECTION=""
          if [[ "$IS_FULL_RELEASE" == "true" ]]; then
            if [[ -f CHANGELOG.md ]]; then
              # Strip HTML comments and the leading "# Changelog" header so the
              # release page shows just the notes, not the template scaffolding.
              CHANGES_SECTION=$(sed -E -e 's/<!--.*-->//g' -e '/<!--/,/-->/d' -e '/^# Changelog$/d' CHANGELOG.md | sed -e 's/^[[:space:]]*$//' | awk 'NF{p=1} p')
            fi
            if [[ -z "$CHANGES_SECTION" ]]; then
              CHANGES_SECTION="No release notes provided."
            fi
          else
            CHANGES_SECTION="Automated nightly build with latest changes."
          fi

          PDF_LINE=""
          if [[ "$IS_FULL_RELEASE" == "true" ]]; then
            PDF_LINE="- **User Guide (PDF)**: \`ChordNotepad-UserGuide.pdf\`"
          fi

          # A random delimiter, so no line of the notes can end the value early.
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$DELIM"
            echo "## Chord Notepad ${VERSION}"
            echo ""
            echo "### What's New"
            echo ""
            echo "${CHANGES_SECTION}"
            echo ""
            echo "### Downloads"
            echo "- **Linux**: \`ChordNotepad-linux-x64\`"
            echo "- **Windows**: \`ChordNotepad-windows-x64.exe\`"
            echo "- **macOS**: \`ChordNotepad-macos-arm64\`"
            if [[ -n "$PDF_LINE" ]]; then echo "$PDF_LINE"; fi
            echo "- **Source code**: \`ChordNotepad-${BASE_VERSION}-source.tar.gz\`, and the source of the bundled third-party libraries in \`ChordNotepad-${BASE_VERSION}-third-party-sources.tar\` (Help > Open Source Licences > Source code)"
            echo ""
            echo "### Installation"
            echo ""
            echo "**Linux:**"
            echo '```bash'
            echo "chmod +x ChordNotepad-linux-x64"
            echo "./ChordNotepad-linux-x64"
            echo '```'
            echo "Note: Requires \`libfluidsynth3\` installed"
            echo ""
            echo "**Windows:**"
            echo "Double-click \`ChordNotepad-windows-x64.exe\` to run"
            echo ""
            echo "**macOS:**"
            echo '```bash'
            echo "chmod +x ChordNotepad-macos-arm64"
            echo "./ChordNotepad-macos-arm64"
            echo '```'
            echo "Note: Requires FluidSynth installed via Homebrew"
            echo "$DELIM"
          } >> $GITHUB_OUTPUT

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_full_release=$IS_FULL_RELEASE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease }}
          files: |
            artifacts/ChordNotepad-linux/*
            artifacts/ChordNotepad-flatpak/*
            artifacts/ChordNotepad-windows/*
            artifacts/ChordNotepad-macos/*
            artifacts/documentation-pdf/*.pdf
            artifacts/sources/*
          body: ${{ steps.release_info.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rotate-changelog:
    name: Rotate CHANGELOG into history
    needs: [create-release]
    runs-on: ubuntu-latest
    # Only after a full-release dispatch. Tag-push releases skip this because
    # main may have moved past the tagged commit; we don't want to clobber that.
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.build_type == 'release' &&
      needs.create-release.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rotate CHANGELOG.md into CHANGELOG_HISTORY.md
        run: |
          set -euo pipefail

          BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
          BUILD_NUMBER="${{ github.run_number }}"
          RELEASE_DATE=$(date -u +"%Y-%m-%d")
          TAG_NAME="v${BASE_VERSION}-build${BUILD_NUMBER}"

          # Pull just the notes out of CHANGELOG.md (strip HTML comments and the
          # top-level "# Changelog" heading).
          NOTES=$(sed -E -e 's/<!--.*-->//g' -e '/<!--/,/-->/d' -e '/^# Changelog$/d' CHANGELOG.md | awk 'NF{p=1} p')
          if [[ -z "${NOTES// }" ]]; then
            NOTES="_No release notes provided._"
          fi

          # Prepend a new section to CHANGELOG_HISTORY.md, preserving the file header.
          if [[ ! -f CHANGELOG_HISTORY.md ]]; then
            printf '# Release History\n\n' > CHANGELOG_HISTORY.md
          fi

          HEADER=$(head -n 4 CHANGELOG_HISTORY.md)
          TAIL=$(tail -n +5 CHANGELOG_HISTORY.md)

          {
            printf '%s\n\n' "$HEADER"
            printf '## %s — %s\n\n' "$TAG_NAME" "$RELEASE_DATE"
            printf '%s\n\n' "$NOTES"
            if [[ -n "$TAIL" ]]; then
              printf '%s\n' "$TAIL"
            fi
          } > CHANGELOG_HISTORY.md.new
          mv CHANGELOG_HISTORY.md.new CHANGELOG_HISTORY.md

          # Reset CHANGELOG.md to an empty template for the next release.
          cat > CHANGELOG.md << 'EOF'
          # Changelog

          <!--
          This file holds release notes for the *next* full release.
          Write entries here as you work. When a full release is published, the contents
          of this file are used as the GitHub release description, then automatically
          moved to CHANGELOG_HISTORY.md and this file is reset.
          -->

          _No changes yet._
          EOF

          echo "::group::Updated CHANGELOG_HISTORY.md (head)"
          head -n 30 CHANGELOG_HISTORY.md
          echo "::endgroup::"

      - name: Commit and push rotation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- CHANGELOG.md CHANGELOG_HISTORY.md; then
            echo "No changelog changes to commit (already in sync)."
            exit 0
          fi

          git add CHANGELOG.md CHANGELOG_HISTORY.md
          git commit -m "Rotate changelog for v$(cat VERSION) build ${{ github.run_number }} [skip ci]"
          git push origin HEAD:main

  cleanup-nightly:
    name: Cleanup Old Nightly Releases
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Skip when producing a full release - we only want to prune nightly tags.
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_type != 'release')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete old nightly releases
        uses: dev-drprasad/delete-older-releases@5494cd8b61c31b3c7a15f6267901195ec7df64e8 # v0.3.2
        with:
          keep_latest: 5
          delete_tag_pattern: nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android (unit tests, lint, debug APK)
    runs-on: ubuntu-latest
    # Independent of the desktop jobs and the release flow: nothing needs this
    # job and it attaches nothing (Android release artifacts come with M6).
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      # Keep in step with android/native/build.sh and android/app/build.gradle.kts.
      NDK_VERSION: 27.3.13750724
      CMAKE_VERSION: 3.31.6
      PYTHONHASHSEED: '0'
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The documented two-step init (docs/ANDROID.md): shallow, and without
      # FluidSynth's test/manual data submodule.
      - name: Check out the native sources
        working-directory: .
        run: |
          git submodule update --init --depth 1 android/native
          git -C android/native/fluidsynth submodule update --init --depth 1 gcem signalsmith-audio-basics

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # Chaquopy's buildPython: the same 3.14 micro version as its runtime and
      # the local builds (reproducible .pyc files).
      - name: Set up Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # The User Guide (help/*.rst, sphinx -t android) is built into the APK's
      # assets by Gradle with the same Python; hashes pinned from Pipfile.lock.
      - name: Install Sphinx for the User Guide
        run: python -m pip install --require-hashes -r docs-requirements.txt

      - name: Build environment
        run: |
          {
            echo "CHAQUOPY_BUILD_PYTHON=${{ steps.python.outputs.python-path }}"
            echo "CHORD_NOTEPAD_ANDROID_CACHE=$RUNNER_TEMP/android-cache"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            # Natives cache key: build.sh plus every pinned submodule commit
            # (FluidSynth's commit pins its own gcem/signalsmith submodules).
            echo "NATIVES_KEY=$(git -C .. ls-tree HEAD android/native/ | sha256sum | cut -c1-16)"
          } >> "$GITHUB_ENV"

      - name: Install SDK packages (NDK, CMake, platform, build-tools)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.1.0" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # build.sh skips an ABI whose stamp matches its inputs, so a restored
      # cache means no native compile at all.
      - name: Cache native libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            android/build/native/*/lib
            android/build/native/*/stamp
          key: android-natives-${{ hashFiles('android/native/build.sh') }}-${{ env.NATIVES_KEY }}

      - name: Cache Python wheelhouse
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-cache/wheelhouse
          key: android-wheelhouse-${{ hashFiles('android/requirements.txt') }}

      # pip download --require-hashes --no-deps for anything missing, then an
      # offline hash check of the whole wheelhouse.
      - name: Fetch Python wheelhouse
        run: |
          "$CHAQUOPY_BUILD_PYTHON" -I tools/build_wheelhouse.py fetch
          "$CHAQUOPY_BUILD_PYTHON" -I tools/build_wheelhouse.py check

      # Both flavours: foss (GitHub APK, F-Droid) and play (Google Play, with
      # Play Billing). docs/ANDROID.md, "Startup screen and support prompt".
      - name: Unit tests, lint, debug APK
        run: >-
          ./gradlew
          testFossDebugUnitTest testPlayDebugUnitTest
          lintFossDebug lintPlayDebug
          assembleFossDebug assemblePlayDebug

      - name: Check 16 KB page alignment
        run: |
          for APK in app/build/outputs/apk/foss/debug/app-foss-debug.apk app/build/outputs/apk/play/debug/app-play-debug.apk; do
            python3 tools/check_16k.py "$APK"
            "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 4 "$APK"
          done

      - name: Check the merged manifest (no INTERNET, no Play services)
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          python3 tools/check_manifest.py --flavor foss --aapt2 "$AAPT2" app/build/outputs/apk/foss/debug/app-foss-debug.apk
          python3 tools/check_manifest.py --flavor play --aapt2 "$AAPT2" app/build/outputs/apk/play/debug/app-play-debug.apk

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14

  # --- Android release (M6) ----------------------------------------------
  # Plain v<VERSION> tag pushes and release dispatches only; nightlies and
  # other dispatches never touch the release keys. Produces, as workflow
  # artifacts:
  #   ChordNotepad-android-play: the play flavour's AAB signed with the Play
  #     upload key, uploaded to Play Console by hand (like the MSIX), never
  #     attached;
  #   ChordNotepad-android: the foss flavour's universal APK signed with the FOSS key, the
  #     full source tarball (submodules included) and SHA256SUMS, which
  #     attach-android puts on the GitHub release.
  # The keys live in the `android-release` environment's secrets
  # (docs/RELEASE.md, "Android"); without them the outputs are unsigned and the
  # job warns. Nothing desktop depends on this job, so an Android failure never
  # blocks the desktop release.
  android-release:
    name: Android release (signed AAB and APK, source tarball)
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')
    environment: android-release
    permissions:
      contents: read
    timeout-minutes: 120
    outputs:
      apk_signed: ${{ steps.keys.outputs.foss }}
      apk_cert_sha256: ${{ steps.verify-apk.outputs.cert_sha256 }}
      version: ${{ steps.version.outputs.version }}
    env:
      # Keep in step with the android job above, android/native/build.sh and
      # android/app/build.gradle.kts.
      NDK_VERSION: 27.3.13750724
      CMAKE_VERSION: 3.31.6
      BUILD_TOOLS: 36.1.0
      PYTHONHASHSEED: '0'
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Releases are plain v<VERSION> tags; the versionCode check in Gradle
      # then guarantees the AAB/APK carry the matching version.
      - name: Check the tag against VERSION
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < ../VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Android releases come from plain v<VERSION> tags: tag $GITHUB_REF_NAME, VERSION $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out the native sources
        working-directory: .
        run: |
          git submodule update --init --depth 1 android/native
          git -C android/native/fluidsynth submodule update --init --depth 1 gcem signalsmith-audio-basics

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.8'

      # Restore only: a release build doesn't write the shared Gradle cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Install Sphinx for the User Guide
        run: python -m pip install --require-hashes -r docs-requirements.txt

      # Reproducible-build inputs: the commit's time as SOURCE_DATE_EPOCH (it
      # makes pip write hash-based .pyc files), PYTHONHASHSEED=0 (job env) and
      # the commit id passed to Gradle explicitly (BuildConfig.COMMIT).
      - name: Build environment
        run: |
          {
            echo "CHAQUOPY_BUILD_PYTHON=${{ steps.python.outputs.python-path }}"
            echo "CHORD_NOTEPAD_ANDROID_CACHE=$RUNNER_TEMP/android-cache"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "CN_COMMIT=$(git rev-parse --short=9 HEAD)"
          } >> "$GITHUB_ENV"

      - name: Install SDK packages (NDK, CMake, platform, build-tools)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;$BUILD_TOOLS" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # The wheelhouse is hash-checked after restoring, so its cache is safe to
      # use. The natives are deliberately built from the submodules here, not
      # restored from the cache the android job fills.
      - name: Restore Python wheelhouse
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-cache/wheelhouse
          key: android-wheelhouse-${{ hashFiles('android/requirements.txt') }}

      - name: Fetch Python wheelhouse
        run: |
          "$CHAQUOPY_BUILD_PYTHON" -I tools/build_wheelhouse.py fetch
          "$CHAQUOPY_BUILD_PYTHON" -I tools/build_wheelhouse.py check

      - name: Decode signing keys
        id: keys
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          FOSS_KEYSTORE_B64: ${{ secrets.ANDROID_FOSS_KEYSTORE_B64 }}
          FOSS_STORE_PASSWORD: ${{ secrets.ANDROID_FOSS_STORE_PASSWORD }}
        run: |
          KEYS="$RUNNER_TEMP/android-keys"
          mkdir -p -m 700 "$KEYS"
          for key in upload foss; do
            upper=${key^^}
            b64_var="${upper}_KEYSTORE_B64"; pw_var="${upper}_STORE_PASSWORD"
            if [[ -n "${!b64_var}" && -n "${!pw_var}" ]]; then
              printf '%s' "${!b64_var}" | base64 -d > "$KEYS/$key.p12"
              chmod 600 "$KEYS/$key.p12"
              echo "$key=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::ANDROID_${upper}_KEYSTORE_B64 / ANDROID_${upper}_STORE_PASSWORD not set in the android-release environment; the $key build stays unsigned"
              echo "$key=false" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "KEYS_DIR=$KEYS" >> "$GITHUB_ENV"

      - name: Build the Play bundle (AAB, upload key)
        env:
          CN_UPLOAD_STORE_FILE: ${{ env.KEYS_DIR }}/upload.p12
          CN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          CN_UPLOAD_KEY_ALIAS: upload
          SIGNING: ${{ steps.keys.outputs.upload == 'true' && 'upload' || 'none' }}
        run: ./gradlew --no-configuration-cache bundlePlayRelease -PcnSigning="$SIGNING" -PcnCommit="$CN_COMMIT"

      - name: Build the GitHub APK (universal, FOSS key)
        env:
          CN_FOSS_STORE_FILE: ${{ env.KEYS_DIR }}/foss.p12
          CN_FOSS_STORE_PASSWORD: ${{ secrets.ANDROID_FOSS_STORE_PASSWORD }}
          CN_FOSS_KEY_ALIAS: foss
          SIGNING: ${{ steps.keys.outputs.foss == 'true' && 'foss' || 'none' }}
        run: ./gradlew --no-configuration-cache assembleFossRelease -PcnSigning="$SIGNING" -PcnCommit="$CN_COMMIT"

      - name: Remove the decoded keys
        if: always()
        run: rm -rf "$KEYS_DIR"

      # aapt2 can't read an AAB, so the play flavour's merged manifest is
      # checked through an unsigned APK of the same variant (never shipped).
      - name: Check the Play build's merged manifest
        run: |
          ./gradlew assemblePlayRelease -PcnSigning=none -PcnCommit="$CN_COMMIT"
          python3 tools/check_manifest.py --flavor play --aapt2 "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" \
            app/build/outputs/apk/play/release/app-play-release-unsigned.apk

      - name: Collect outputs
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p dist-android
          if [[ "${{ steps.keys.outputs.foss }}" == "true" ]]; then
            cp app/build/outputs/apk/foss/release/app-foss-release.apk dist-android/ChordNotepad-android.apk
          else
            cp app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk dist-android/ChordNotepad-android-unsigned.apk
          fi
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "dist-android/ChordNotepad-$V-play.aab"
          python3 tools/make_source_tarball.py --repo .. --out "dist-android/ChordNotepad-$V-source.tar.gz"
          ls -l dist-android

      # v2 + v3 signature, 16 KB page alignment, and the merged manifest (no
      # INTERNET, no Play services). ANDROID_FOSS_CERT_SHA256 (environment or
      # repo variable, lowercase hex) pins the expected certificate.
      - name: Verify the APK
        id: verify-apk
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_FOSS_CERT_SHA256 }}
        run: |
          APK=$(ls dist-android/*.apk)
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          python3 tools/check_16k.py "$APK"
          "$BT/zipalign" -c -P 16 4 "$APK"
          python3 tools/check_manifest.py --flavor foss --aapt2 "$BT/aapt2" "$APK"
          if [[ "${{ steps.keys.outputs.foss }}" != "true" ]]; then
            echo "::warning::The APK is unsigned (no FOSS key); it won't be attached to the release"
            exit 0
          fi
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -v '^WARNING' | tee apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' apksigner.txt
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner.txt)
          if [[ -n "$EXPECTED_CERT" && "$CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::APK signed with certificate $CERT, expected ANDROID_FOSS_CERT_SHA256 $EXPECTED_CERT"
            exit 1
          fi
          echo "cert_sha256=$CERT" >> "$GITHUB_OUTPUT"

      - name: Verify the AAB
        run: |
          AAB=$(ls dist-android/*.aab)
          if [[ "${{ steps.keys.outputs.upload }}" != "true" ]]; then
            echo "::warning::The AAB is unsigned (no upload key); Play Console won't accept it"
            exit 0
          fi
          # An AAB always draws jarsigner warnings (self-signed, entry order);
          # only "jar verified." matters.
          jarsigner -verify "$AAB" > jarsigner.txt 2>&1 || { cat jarsigner.txt; exit 1; }
          grep -q '^jar verified' jarsigner.txt || { cat jarsigner.txt; exit 1; }
          keytool -printcert -jarfile "$AAB" | grep -E 'Owner:|SHA256:'

      - name: Checksums
        working-directory: android/dist-android
        run: sha256sum ChordNotepad-android*.apk ChordNotepad-*-source.tar.gz | tee SHA256SUMS

      - name: Upload Play bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ChordNotepad-android-play
          path: android/dist-android/*.aab
          retention-days: 90

      - name: Upload APK and source tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ChordNotepad-android
          path: |
            android/dist-android/*.apk
            android/dist-android/*-source.tar.gz
            android/dist-android/SHA256SUMS
          retention-days: 90

  # Puts the FOSS-signed APK and the source tarball on the GitHub release that
  # create-release made. Runs only when both succeeded, so it can't hold up or
  # fail the desktop release; an unsigned APK is never attached.
  attach-android:
    name: Attach Android to the release
    needs: [create-release, android-release]
    if: |
      always() &&
      needs.create-release.result == 'success' &&
      needs.android-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChordNotepad-android
          path: android-dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_SIGNED: ${{ needs.android-release.outputs.apk_signed }}
          CERT: ${{ needs.android-release.outputs.apk_cert_sha256 }}
          VERSION: ${{ needs.android-release.outputs.version }}
        run: |
          # Same tag as create-release: the pushed tag, or v<VERSION>-build<run>.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VERSION}-build${{ github.run_number }}"
          fi
          cd android-dist
          FILES=("ChordNotepad-$VERSION-source.tar.gz")
          if [[ "$APK_SIGNED" == "true" ]]; then
            FILES+=(ChordNotepad-android.apk SHA256SUMS)
          else
            echo "::warning::No FOSS-signed APK; attaching only the source tarball"
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"

          # Add an Android section to the release notes (once).
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          if ! grep -q '^### Android' notes.md; then
            {
              echo ""
              echo "### Android"
              if [[ "$APK_SIGNED" == "true" ]]; then
                echo "- **Android**: \`ChordNotepad-android.apk\` (Android 7.0 or newer, 64-bit ARM or x86_64)."
                echo "  Signing certificate SHA-256: \`$CERT\`"
                echo "  Google Play and this APK are signed with different keys, so one can't update the other;"
                echo "  to switch, uninstall first."
              fi
              echo "- **Source code** (app, build scripts and the native libraries' sources): \`ChordNotepad-$VERSION-source.tar.gz\`"
            } >> notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
