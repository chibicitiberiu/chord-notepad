name: iOS

# The iOS app on GitHub's macOS runners (docs/IOS.md, "CI"): the kit's tests
# on a Mac host, then the app built for the simulator and tested on an iPhone
# and an iPad, the preview catalog rendered to PNGs, screenshots of the
# running app, and an unsigned device build with the App Store checks, the
# prebuilt inputs for the borrowed Mac and a rehearsal of its bootstrap.
#
# The release lanes (TestFlight, the development IPA) run only by hand or on
# the monthly schedule, in the ios-release environment, and are skipped
# while its secrets aren't set (docs/IOS.md, "Release lanes").

on:
  push:
    branches: [ master, main ]
    paths:
      - 'ios/**'
      - 'core/**'
      - 'packaging/ios/**'
      - 'android/bridge_schema.json'
      - 'android/requirements.txt'
      - 'android/tools/strip_music21.py'
      - 'android/tools/build_wheelhouse.py'
      - 'android/tools/export_clef_glyphs.py'
      - 'android/app/src/test/resources/chord_sheet/**'
      # The voicing form's fixtures (the kit's Settings tests), the licence
      # texts the app copies, the Settings icons' source (ios/tools/mdi_assets.py),
      # Android's FOSS support link the kit checks About against, the version.
      - 'android/app/src/test/resources/voicing_form/**'
      - 'resources/licenses/texts/**'
      - 'android/app/src/main/kotlin/com/tibich/chordnotepad/ui/settings/SettingsIcons.kt'
      - 'VERSION'
      - 'resources/soundfont/**'
      # The quick-start song, the kit's scenes and the menu's Examples.
      - 'examples/*.txt'
      - 'android/tools/help_shot_songs/scarborough_fair.txt'
      - 'android/tools/help_shot_songs/amazing_grace*.txt'
      - 'android/app/src/main/res/drawable/mdi_*.xml'
      # Chord Notepad's own icons the iOS asset catalog copies (ios/tools/mdi_assets.py).
      - 'android/app/src/main/res/drawable/ic_capo.xml'
      - 'android/app/src/main/res/drawable/ic_time_signature.xml'
      - 'android/app/src/main/res/drawable/ic_transpose.xml'
      # The user guide the app ships (its iOS edition) and the Sphinx stack it
      # is built with; the colour demo song of the guide's scenes.
      - 'help/**'
      - 'android/docs-requirements.txt'
      - 'android/tools/help_shot_songs/colours.txt'
      - 'android/app/src/main/assets/licenses/components.json'
      # The buttons' VoiceOver labels are Android's strings and the Qt find bar's tooltips.
      - 'android/app/src/main/res/values/strings*.xml'
      - 'desktop/chordnotepad_desktop/qml/app/FindBar.qml'
      - '.github/workflows/ios.yml'
      - '.github/actions/ios-app-setup/**'
      # The release lanes' keychain script.
      - 'packaging/apple/**'
  # TestFlight builds expire after 90 days: re-upload the newest tested
  # commit once a month (only the TestFlight lane runs, and only with the
  # secrets; the tests ran on that commit's push).
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Archive, sign and upload to TestFlight (ios-release secrets)'
        type: boolean
        default: false
      development_ipa:
        description: 'Development-signed IPA and dSYM for the registered iPhone (ios-release secrets)'
        type: boolean
        default: false
      unsigned_archive:
        description: 'xcodebuild archive without signing, as the lanes archive (no secrets)'
        type: boolean
        default: false

permissions:
  contents: read

# Every commit gets its own run: two slices are worked on at once and push
# to main in turn, and each needs its own green run, so a newer push must not
# cancel an older one.
concurrency:
  group: ios-${{ github.sha }}
  cancel-in-progress: false

jobs:
  kit:
    name: Kit tests (macOS host)
    # The monthly schedule only re-uploads to TestFlight (testflight below).
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Xcode CI builds with is pinned in ios/.xcode-version (the image
      # carries several; its default moves).
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat ios/.xcode-version).app"
          xcodebuild -version
          swift --version

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # The core loads FluidSynth even with the fake player, so the host
      # needs a libfluidsynth: the macOS app's own build, no Homebrew.
      - name: Cache the host FluidSynth
        id: host-fluidsynth
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/build/host-fluidsynth
          key: ios-host-fluidsynth-${{ hashFiles('packaging/macos/build_fluidsynth.sh', 'ios/.xcode-version') }}

      - name: Build the host FluidSynth
        if: steps.host-fluidsynth.outputs.cache-hit != 'true'
        run: packaging/macos/build_fluidsynth.sh "$PWD/ios/build/host-fluidsynth"

      - name: Cache the wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/build/wheel-cache
          key: ios-wheels-${{ hashFiles('android/requirements.txt', 'android/tools/strip_music21.py') }}

      # The core's packages as the app ships them (requirements.txt minus
      # chardet, the trimmed music21); the tests put app_packages on sys.path.
      - name: Build the Python bundle
        run: python -I packaging/ios/build_python_bundle.py ios/build/python-bundle

      # CN_PYTHON_PKGCONFIG only here: Package.swift links a host Python only
      # when it is set, and an Xcode build for iOS must never get one.
      - name: swift test
        working-directory: ios/ChordNotepadKit
        env:
          CN_REQUIRE_CORE: '1'
        run: |
          export PKG_CONFIG_PATH="$pythonLocation/lib/pkgconfig"
          export CN_PYTHON_PKGCONFIG=python3-embed
          pkg-config --cflags --libs python3-embed
          export CN_SITE_PACKAGES="$GITHUB_WORKSPACE/ios/build/python-bundle/app_packages"
          export CHORD_NOTEPAD_LIBFLUIDSYNTH="$GITHUB_WORKSPACE/ios/build/host-fluidsynth/lib/libfluidsynth.3.dylib"
          swift test 2>&1 | tee "$RUNNER_TEMP/kit-tests.log"

      - name: Upload the kit test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-kit-tests
          path: ${{ runner.temp }}/kit-tests.log
          if-no-files-found: ignore

  # One job per simulator, each on its own runner with one simulator booted
  # (with both booted on one runner the iPad's launches took three to four
  # times as long), and the device build beside them: a run takes the
  # longest of the three instead of their sum.
  simulator:
    name: App on the ${{ matrix.label }} simulator
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The iPhone also writes the preview catalog (both sizes) and
          # uploads the guide; the iPad skips the catalog.
          - device: iphone
            label: iPhone
            catalog: true
          - device: ipad
            label: iPad
            catalog: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ios-app-setup

      # Logged only: whether this runner has an audio device decides what
      # the live playback check below can show.
      - name: Audio devices (preflight)
        run: |
          xcrun simctl list runtimes
          system_profiler SPAudioDataType || true

      - name: Pick the simulator
        run: |
          python3 ios/tools/ci_simulators.py >> "$GITHUB_ENV"
          python3 ios/tools/ci_simulators.py 2>/dev/null \
            | sed -n "s/^$(echo '${{ matrix.device }}' | tr a-z A-Z)_UDID=/UDID=/p" >> "$GITHUB_ENV"

      # The build stamp (Info.plist CNGitCommit, CNBuildDate) and the version
      # come from here.
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios/ChordNotepad.xcodeproj -scheme ChordNotepad \
            -destination "id=$UDID" -derivedDataPath ios/build/DerivedData \
            MARKETING_VERSION="$(cat VERSION)" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CN_GIT_COMMIT="$(git rev-parse --short HEAD)" CN_BUILD_DATE="$(date -u +%Y-%m-%d)" \
            | tee "$RUNNER_TEMP/build-simulator-${{ matrix.device }}.log" | grep -E 'error:|\*\* ' || true
          grep -q '\*\* TEST BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build-simulator-${{ matrix.device }}.log" \
            || { tail -n 80 "$RUNNER_TEMP/build-simulator-${{ matrix.device }}.log"; exit 1; }
          APP=ios/build/DerivedData/Build/Products/Debug-iphonesimulator/ChordNotepad.app
          echo "SIM_APP=$APP" >> "$GITHUB_ENV"
          du -sh "$APP" "$APP/python" "$APP/Frameworks"
          ls "$APP/Frameworks" | head -20

      # The app's XCTests: the session over the bundled Python and core
      # (FakePlayer), the offline synth render (blocking), and on the iPhone
      # the preview catalog written to PNGs.
      - name: Test on the ${{ matrix.label }} simulator
        env:
          TEST_RUNNER_CN_CATALOG_DIR: ${{ github.workspace }}/ios/build/artifacts/catalog
        run: |
          set -o pipefail
          skip=()
          if [ "${{ matrix.catalog }}" != true ]; then skip=(-skip-testing:ChordNotepadTests/CatalogTests); fi
          log="$RUNNER_TEMP/test-${{ matrix.device }}.log"
          xcodebuild test-without-building \
            -project ios/ChordNotepad.xcodeproj -scheme ChordNotepad \
            -destination "id=$UDID" -derivedDataPath ios/build/DerivedData \
            "${skip[@]}" \
            -resultBundlePath "ios/build/artifacts/results/${{ matrix.device }}.xcresult" \
            | tee "$log" | grep -E 'Test (Case|Suite)|error|Catalog:|\*\* ' || true
          grep -q '\*\* TEST EXECUTE SUCCEEDED \*\*' "$log" || { tail -n 120 "$log"; exit 1; }

      - name: Catalog images
        if: matrix.catalog
        run: |
          count=$(find ios/build/artifacts/catalog -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          echo "$count catalog images"
          if [ "$count" -eq 0 ]; then
            # TEST_RUNNER_ didn't reach the test: take them from the result bundle.
            xcrun xcresulttool export attachments \
              --path "ios/build/artifacts/results/${{ matrix.device }}.xcresult" \
              --output-path ios/build/artifacts/catalog
            find ios/build/artifacts/catalog -name '*.png' | wc -l
          fi

      # The real app: the main screen with the quick-start song (Play), the
      # menu, Diagnostics with the self-test and live CoreAudio playback,
      # Play with the chord sheet, Edit after the app typed into the editor
      # (editor.json must say the session highlighted the typing), and the
      # -CNScreen hooks of each slice (ios/tools/ci_screenshots.sh).
      - name: Screenshots
        run: ios/tools/ci_screenshots.sh "$UDID" ${{ matrix.device }} "$SIM_APP" ios/build/artifacts/screenshots

      # Not blocking: a runner may have no audio device. The offline render
      # above is the check that must pass.
      - name: Live audio (CoreAudio in the simulator)
        continue-on-error: true
        run: |
          python3 - "ios/build/artifacts/screenshots/${{ matrix.device }}-diagnostics/selftest.json" "${{ matrix.device }}" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          live = report.get("liveAudio") or {}
          print(f"{sys.argv[2]}: live player {'started' if live.get('initialized') else 'not started'}"
                f" ({live.get('error')}); route {report.get('audioRoute')}; problems {report.get('problems')}")
          sys.exit(0 if live.get("initialized") else 1)
          PY

      - name: Collect logs
        if: always()
        run: |
          mkdir -p ios/build/artifacts/logs
          cp "$RUNNER_TEMP"/*.log ios/build/artifacts/logs/ 2>/dev/null || true

      - name: Upload the catalog
        if: always() && matrix.catalog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-catalog
          path: ios/build/artifacts/catalog
          if-no-files-found: ignore

      - name: Upload the user guide
        if: always() && matrix.catalog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-help
          path: ios/build/help
          if-no-files-found: ignore

      # Each job uploads its own part; the merge job below joins them into
      # ios-screenshots and ios-results, as one job used to upload them.
      - name: Upload the screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots-${{ matrix.device }}
          path: ios/build/artifacts/screenshots
          if-no-files-found: ignore

      - name: Upload the test results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results-${{ matrix.device }}
          path: |
            ios/build/artifacts/results
            ios/build/artifacts/logs
          if-no-files-found: ignore

  # Device packaging problems (the frameworks' Info.plists, the Python
  # phase, architectures) show up only in a device build.
  device:
    name: Unsigned device build
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the bootstrap rehearsal below clones a git
          # bundle of it, as the SSD carries one (a shallow clone can't be bundled).
          fetch-depth: 0

      - uses: ./.github/actions/ios-app-setup

      - name: Unsigned device build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/ChordNotepad.xcodeproj -scheme ChordNotepad -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$(cat VERSION)" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CN_GIT_COMMIT="$(git rev-parse --short HEAD)" CN_BUILD_DATE="$(date -u +%Y-%m-%d)" \
            | tee "$RUNNER_TEMP/build-device.log" | grep -E 'error:|\*\* ' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build-device.log" \
            || { tail -n 80 "$RUNNER_TEMP/build-device.log"; exit 1; }
          APP=ios/build/DerivedData/Build/Products/Release-iphoneos/ChordNotepad.app
          du -sh "$APP"
          lipo -info "$APP/ChordNotepad"
          plutil -p "$APP/Info.plist" | grep -E 'CNGitCommit|CFBundle(Short)?Version|ITSApp|UIFileSharing'
          # What App Store validation looks for: the privacy manifests, the
          # compiled icon.
          for file in PrivacyInfo.xcprivacy Frameworks/_ssl.framework/PrivacyInfo.xcprivacy \
              Frameworks/_hashlib.framework/PrivacyInfo.xcprivacy Assets.car python/lib/python3.14/os.py; do
            test -e "$APP/$file" || { echo "Missing from the app: $file"; exit 1; }
          done
          plutil -extract CFBundleIcons json -o - "$APP/Info.plist"
          echo "$(find "$APP/python" -name '*.pyc' | wc -l | tr -d ' ') .pyc files," \
            "$(find "$APP/Frameworks" -maxdepth 1 -name '*.framework' | wc -l | tr -d ' ') frameworks"
          for framework in "$APP"/Frameworks/*.framework; do
            plutil -extract CFBundleSupportedPlatforms json -o - "$framework/Info.plist" | grep -q iPhoneOS \
              || { echo "$framework isn't marked for iPhoneOS"; exit 1; }
          done
          echo "DEVICE_APP=$APP" >> "$GITHUB_ENV"

      # The bundle ID, the encryption flag, the icons, and a reason in the
      # privacy manifest for every required-reason API the binaries use
      # (ios/tools/check_app_store.py; docs/IOS.md, "App Store requirements").
      - name: App Store checks
        run: |
          find "$DEVICE_APP" -maxdepth 1 -name 'AppIcon*' -print
          xcrun --sdk iphoneos assetutil --info "$DEVICE_APP/Assets.car" > "$RUNNER_TEMP/assets.json"
          python3 -I ios/tools/check_app_store.py "$DEVICE_APP" --assetutil-json "$RUNNER_TEMP/assets.json" \
            --icon-source ios/ChordNotepad/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      # What a session on the borrowed Mac builds from (ios/tools/prepare_ssd.sh
      # copies it to the SSD): the frameworks, the Python bundle and the guide,
      # so nothing is downloaded or compiled there but the app.
      - name: Pack the build inputs for the Mac sessions
        run: |
          git rev-parse HEAD > ios/build/INPUTS_COMMIT
          tar -czf "$RUNNER_TEMP/ios-build-inputs.tar.gz" -C ios/build Frameworks python-bundle help INPUTS_COMMIT
          ls -la "$RUNNER_TEMP/ios-build-inputs.tar.gz"

      - name: Upload the build inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-inputs
          path: ${{ runner.temp }}/ios-build-inputs.tar.gz
          retention-days: 30
          compression-level: 0

      # S0's script as it will run on the MacBook (/bin/bash 3.2, the BSD
      # tools), from an SSD laid out as prepare_ssd.sh lays it out: --verify
      # clones the bundle, unpacks the inputs, generates the project, builds
      # and runs the app on a simulator and lists devices. Only the Xcode and
      # runtime installs aren't rehearsed (the runner has both).
      - name: Rehearse the Mac bootstrap (mac_bootstrap.sh --verify)
        run: |
          SSD="$RUNNER_TEMP/ssd"
          mkdir -p "$SSD"
          # A named ref, as prepare_ssd.sh bundles origin/main (the
          # bootstrap fetches refs/*; a bundle of HEAD alone has none).
          git branch -f ssd-rehearsal HEAD
          git bundle create "$SSD/chord-notepad.bundle" ssd-rehearsal
          git rev-parse HEAD > "$SSD/chord-notepad.ref"
          cp "$RUNNER_TEMP/ios-build-inputs.tar.gz" "$RUNNER_TEMP/xcodegen.zip" "$SSD/"
          cp ios/.xcode-version "$SSD/xcode-version"
          cp ios/tools/mac_bootstrap.sh "$SSD/"
          (cd "$SSD" && shasum -a 256 chord-notepad.bundle chord-notepad.ref ios-build-inputs.tar.gz \
            xcodegen.zip xcode-version mac_bootstrap.sh > SHA256SUMS)
          # Her Mac has no other Python: the build phases must work with
          # Xcode's python3, so the runner's setup-python stays off PATH.
          MAC_PATH=/usr/bin:/bin:/usr/sbin:/sbin
          # The install steps' probes on real macOS (licence, first launch,
          # runtime): with Xcode and the runtime there, nothing would change
          # but the DEVELOPER_DIR line for ~/.zprofile.
          env PATH="$MAC_PATH" /bin/bash "$SSD/mac_bootstrap.sh" --ssd "$SSD" --dry-run --only "xcode runtime" \
            --workdir "$RUNNER_TEMP/s0" --report-dir "$RUNNER_TEMP/s0-dry" | tee "$RUNNER_TEMP/s0-dry.log"
          if grep '^DRY' "$RUNNER_TEMP/s0-dry.log" | grep -qv zprofile; then
            echo "::error::mac_bootstrap.sh would change an installed Xcode or runtime"
            exit 1
          fi
          env PATH="$MAC_PATH" /bin/bash "$SSD/mac_bootstrap.sh" --ssd "$SSD" --verify --workdir "$RUNNER_TEMP/s0" \
            --report-dir "$RUNNER_TEMP/s0-report"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results-device
          path: ${{ runner.temp }}/build-device.log
          if-no-files-found: ignore

      - name: Upload the bootstrap rehearsal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-bootstrap-rehearsal
          path: ${{ runner.temp }}/s0-report
          if-no-files-found: ignore

  # The artifacts under the names one job used to upload them as
  # (ios-screenshots, ios-results), so `gh run download -n ios-screenshots`
  # still gets both simulators' screenshots. On Linux: no macOS runner.
  merge:
    name: Merge the artifacts
    if: always() && github.event_name != 'schedule'
    needs: [simulator, device]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge the screenshots
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: ios-screenshots
          pattern: ios-screenshots-*
          delete-merged: true

      - name: Merge the test results and logs
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: ios-results
          pattern: ios-results-*
          delete-merged: true

  # ---- Release lanes (docs/IOS.md, "Release lanes") ------------------------
  # None of these runs on a push. The gate reads which ios-release secrets
  # are set: with none it says so and every lane is skipped; with only some
  # it fails and names the missing ones, so a half-finished setup can't pass
  # for "not enrolled yet".
  release-gate:
    name: Release lanes (secrets and commit)
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && (inputs.testflight || inputs.development_ipa)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ios-release
    permissions:
      contents: read
      actions: read
    outputs:
      testflight: ${{ steps.secrets.outputs.testflight }}
      development: ${{ steps.secrets.outputs.development }}
      sha: ${{ steps.commit.outputs.sha }}
      build: ${{ steps.commit.outputs.build }}
    steps:
      - name: Which secrets are set
        id: secrets
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DEVELOPMENT_P12_BASE64: ${{ secrets.IOS_DEVELOPMENT_P12_BASE64 }}
          IOS_DEVELOPMENT_P12_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_P12_PASSWORD }}
          IOS_ARTIFACT_PASSPHRASE: ${{ secrets.IOS_ARTIFACT_PASSPHRASE }}
          WANT_TESTFLIGHT: ${{ github.event_name == 'schedule' || inputs.testflight }}
          WANT_DEVELOPMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.development_ipa }}
        run: |
          required="ASC_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID IOS_DEVELOPMENT_P12_BASE64 IOS_DEVELOPMENT_P12_PASSWORD"
          absent=""
          for name in $required; do
            if [ -z "${!name}" ]; then absent="$absent $name"; fi
          done
          absent=${absent# }
          if [ "$absent" = "$required" ]; then
            echo "::notice::No iOS signing secrets in the ios-release environment yet: the release lanes are skipped (docs/IOS.md, \"Enrollment day\")"
            { echo "testflight=false"; echo "development=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$absent" ]; then
            echo "::error::The ios-release environment is missing: $absent"
            exit 1
          fi
          if [ "$WANT_DEVELOPMENT" = true ] && [ -z "$IOS_ARTIFACT_PASSPHRASE" ]; then
            echo "::error::The development IPA needs IOS_ARTIFACT_PASSPHRASE: its profile lists the registered iPhones' UDIDs, so the artifact is encrypted"
            exit 1
          fi
          { echo "testflight=$WANT_TESTFLIGHT"; echo "development=$WANT_DEVELOPMENT"; } >> "$GITHUB_OUTPUT"

      # The schedule builds the newest commit whose tests passed (its own
      # push or dispatch run); a dispatch builds its own commit, after this
      # run's tests. CFBundleVersion is this workflow's run number, which
      # only grows across pushes, dispatches and the schedule, so App Store
      # Connect never sees a number twice; a re-run adds its attempt (57.2
      # comes after 57 and before 58).
      - name: The commit and build number
        id: commit
        if: steps.secrets.outputs.testflight == 'true' || steps.secrets.outputs.development == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ]; then
            sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios.yml --branch main --status success \
              --limit 50 --json headSha,event \
              -q '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].headSha // ""')
            [ -n "$sha" ] || { echo "::error::No green ios.yml run on main to upload"; exit 1; }
          else
            sha=$GITHUB_SHA
          fi
          build=$GITHUB_RUN_NUMBER
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then build="$build.$GITHUB_RUN_ATTEMPT"; fi
          echo "Building ${sha:0:7} as build $build"
          { echo "sha=$sha"; echo "build=$build"; } >> "$GITHUB_OUTPUT"

  # Archive with automatic signing (the development certificate from the
  # secrets signs the archive; the export's distribution signing is Xcode's
  # cloud-managed certificate through the Admin key, or the
  # IOS_DISTRIBUTION_P12 fallback when that secret is set), then upload.
  testflight:
    name: TestFlight upload
    needs: [release-gate, kit, simulator, device]
    if: >-
      always() && needs.release-gate.outputs.testflight == 'true' &&
      (github.event_name == 'schedule' ||
       (needs.kit.result == 'success' && needs.simulator.result == 'success' && needs.device.result == 'success'))
    runs-on: macos-26
    timeout-minutes: 75
    environment: ios-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-gate.outputs.sha }}

      - uses: ./.github/actions/ios-app-setup

      - name: Signing (API key, certificates)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          IOS_DEVELOPMENT_P12_BASE64: ${{ secrets.IOS_DEVELOPMENT_P12_BASE64 }}
          IOS_DEVELOPMENT_P12_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_P12_PASSWORD }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          packaging/apple/import_certificates.sh "$RUNNER_TEMP/ios-signing.keychain-db" IOS_DEVELOPMENT_P12_BASE64 IOS_DEVELOPMENT_P12_PASSWORD \
            IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CN_BUILD_NUMBER: ${{ needs.release-gate.outputs.build }}
        run: ios/tools/ci_archive.sh archive "$RUNNER_TEMP/ChordNotepad.xcarchive"

      - name: App Store checks
        run: |
          APP="$RUNNER_TEMP/ChordNotepad.xcarchive/Products/Applications/ChordNotepad.app"
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" > "$RUNNER_TEMP/assets.json"
          python3 -I ios/tools/check_app_store.py "$APP" --assetutil-json "$RUNNER_TEMP/assets.json" \
            --icon-source ios/ChordNotepad/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Keep the dSYMs
        run: ios/tools/ci_archive.sh dsyms "$RUNNER_TEMP/ChordNotepad.xcarchive" "$RUNNER_TEMP/dsyms"

      - name: Upload the dSYMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-testflight-dsyms
          path: ${{ runner.temp }}/dsyms

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ios/tools/ci_archive.sh export "$RUNNER_TEMP/ChordNotepad.xcarchive" testflight "$RUNNER_TEMP/export"

      - name: Upload the archive and export logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export-testflight.log
          if-no-files-found: ignore

      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys"

  # The same archive exported with development signing, for her iPhone in
  # S2 (its UDID registered first: ios/tools/asc_api.py register-device).
  # The artifact is encrypted with IOS_ARTIFACT_PASSPHRASE: the profile in
  # the IPA lists the registered devices, and the repository is public.
  development:
    name: Development IPA
    needs: [release-gate, kit, simulator, device]
    if: >-
      always() && needs.release-gate.outputs.development == 'true' &&
      needs.kit.result == 'success' && needs.simulator.result == 'success' && needs.device.result == 'success'
    runs-on: macos-26
    timeout-minutes: 75
    environment: ios-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-gate.outputs.sha }}

      - uses: ./.github/actions/ios-app-setup

      - name: Signing (API key, certificate)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          IOS_DEVELOPMENT_P12_BASE64: ${{ secrets.IOS_DEVELOPMENT_P12_BASE64 }}
          IOS_DEVELOPMENT_P12_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_P12_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          packaging/apple/import_certificates.sh "$RUNNER_TEMP/ios-signing.keychain-db" IOS_DEVELOPMENT_P12_BASE64 IOS_DEVELOPMENT_P12_PASSWORD

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CN_BUILD_NUMBER: ${{ needs.release-gate.outputs.build }}
        run: ios/tools/ci_archive.sh archive "$RUNNER_TEMP/ChordNotepad.xcarchive"

      - name: Export the development IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ios/tools/ci_archive.sh export "$RUNNER_TEMP/ChordNotepad.xcarchive" development "$RUNNER_TEMP/export"
          ios/tools/ci_archive.sh dsyms "$RUNNER_TEMP/ChordNotepad.xcarchive" "$RUNNER_TEMP/export"
          # How many devices the profile covers (not which: the log is public).
          unzip -q -o "$RUNNER_TEMP/export/ChordNotepad.ipa" 'Payload/ChordNotepad.app/embedded.mobileprovision' -d "$RUNNER_TEMP/ipa"
          security cms -D -i "$RUNNER_TEMP/ipa/Payload/ChordNotepad.app/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          devices=$(plutil -extract ProvisionedDevices json -o - "$RUNNER_TEMP/profile.plist" \
            | python3 -I -c 'import json, sys; print(len(json.load(sys.stdin)))')
          echo "The profile covers $devices device(s)," \
            "expires $(plutil -extract ExpirationDate raw -o - "$RUNNER_TEMP/profile.plist" || echo '(unknown)')"
          rm -rf "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/profile.plist"

      # The logs go into the encrypted file too (the provisioning output names
      # the devices). Decrypt on Linux: openssl enc -d -aes-256-cbc -pbkdf2
      # -iter 200000 -pass env:IOS_ARTIFACT_PASSPHRASE -in ios-development.tar.enc | tar -x
      - name: Encrypt the IPA and dSYMs
        env:
          IOS_ARTIFACT_PASSPHRASE: ${{ secrets.IOS_ARTIFACT_PASSPHRASE }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          cp "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export-development.log" "$RUNNER_TEMP/export/"
          tar -cf - -C "$RUNNER_TEMP/export" ChordNotepad.ipa dSYMs build-info.txt archive.log export-development.log \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:IOS_ARTIFACT_PASSPHRASE \
                -out "$RUNNER_TEMP/artifact/ios-development.tar.enc"
          cp "$RUNNER_TEMP/export/build-info.txt" "$RUNNER_TEMP/artifact/"
          ls -la "$RUNNER_TEMP/artifact"

      - name: Upload the development IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-development
          path: ${{ runner.temp }}/artifact

      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys"

  # By hand, with no secrets: the archive the lanes make, unsigned, to show
  # that the build phases work under `xcodebuild archive`, the archived app
  # passes the App Store checks, this Xcode knows the export methods the
  # ExportOptions plists name, and what its dSYMs look like (for
  # ios/tools/symbolicate.sh).
  archive-check:
    name: Unsigned archive (rehearses the release lanes)
    if: github.event_name == 'workflow_dispatch' && inputs.unsigned_archive
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ios-app-setup

      - name: Archive without signing
        env:
          CN_BUILD_NUMBER: ${{ github.run_number }}
        run: ios/tools/ci_archive.sh archive "$RUNNER_TEMP/ChordNotepad.xcarchive" --unsigned

      - name: App Store checks
        run: |
          APP="$RUNNER_TEMP/ChordNotepad.xcarchive/Products/Applications/ChordNotepad.app"
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" > "$RUNNER_TEMP/assets.json"
          python3 -I ios/tools/check_app_store.py "$APP" --assetutil-json "$RUNNER_TEMP/assets.json" \
            --icon-source ios/ChordNotepad/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Export options and methods
        run: |
          plutil -lint packaging/ios/ExportOptions-*.plist
          xcodebuild -help > "$RUNNER_TEMP/xcodebuild-help.txt" 2>&1 || true
          for plist in packaging/ios/ExportOptions-*.plist; do
            method=$(plutil -extract method raw -o - "$plist")
            if grep -q -- "$method" "$RUNNER_TEMP/xcodebuild-help.txt"; then
              echo "$plist: method $method is known to this Xcode"
            else
              echo "::error::$plist names method $method, which xcodebuild -help doesn't list"
              exit 1
            fi
          done

      - name: Keep the dSYMs
        run: ios/tools/ci_archive.sh dsyms "$RUNNER_TEMP/ChordNotepad.xcarchive" "$RUNNER_TEMP/dsyms"

      - name: Upload the dSYMs and the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned-archive
          path: |
            ${{ runner.temp }}/dsyms
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/xcodebuild-help.txt
          if-no-files-found: ignore
