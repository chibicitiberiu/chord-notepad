# The iOS app's Xcode project, generated by XcodeGen (docs/IOS.md, "CI"):
#
#   xcodegen generate --spec ios/project.yml
#
# ChordNotepad.xcodeproj is not committed. Before building, put the inputs in
# ios/build (packaging/ios/build_fluidsynth.sh, fetch_python.sh,
# build_python_bundle.py).
name: ChordNotepad
options:
  bundleIdPrefix: com.tibich
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    # The deployment target stays at iOS 17, and iOS 26 APIs only behind
    # #available, so Xcode 16 builds the same code (docs/IOS.md).
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # The app target is Swift 5 mode; the kit is Swift 6.
    SWIFT_VERSION: "5.0"
    # The Python build phase reads ios/build and writes into the app.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # FluidSynth.xcframework's simulator slice is arm64 only, and the
    # Python phase installs one architecture's stdlib.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # The build stamp; CI passes the commit and the date on the command line.
    CN_GIT_COMMIT: dev
    CN_BUILD_DATE: ""
    # No team: the simulator signs ad hoc, device builds run unsigned
    # (CODE_SIGNING_ALLOWED=NO) until enrollment (plan section E).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
packages:
  ChordNotepadKit:
    path: ChordNotepadKit
targets:
  ChordNotepad:
    type: application
    platform: iOS
    sources:
      - path: ChordNotepad
      - path: Fixtures
        type: folder
        buildPhase: resources
      - path: ../resources/soundfont/GeneralUser-GS.sf2
        buildPhase: resources
      - path: ../resources/soundfont/GeneralUser-GS.LICENSE.txt
        buildPhase: resources
      - path: ../examples/01_quick_start.txt
        buildPhase: resources
      # The menu's Examples (AppDocumentStore.examples): examples/*.txt.
      - path: ../examples
        type: folder
        buildPhase: resources
    dependencies:
      - package: ChordNotepadKit
      - framework: build/Frameworks/Python.xcframework
        embed: true
      - framework: build/Frameworks/FluidSynth.xcframework
        embed: true
    postBuildScripts:
      - name: Chord sheet glyphs
        script: |
          "$PROJECT_DIR/tools/export_glyphs.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
      - name: Licences
        script: |
          # The licence list and the texts it names, into <app>/licenses (About › Open source licences).
          PYTHON=$(command -v python3.14 || command -v python3)
          "$PYTHON" -I "$PROJECT_DIR/tools/copy_licences.py" "$CODESIGNING_FOLDER_PATH/licenses"
        basedOnDependencyAnalysis: false
        showEnvVars: false
      - name: User guide
        script: |
          # The iOS edition of the guide (ios/tools/build_help.sh ios/build/help) into <app>/help.
          src="$PROJECT_DIR/build/help"
          if [ ! -f "$src/index.html" ]; then
            echo "error: the user guide isn't built: run ios/tools/build_help.sh ios/build/help"
            exit 1
          fi
          rm -rf "$CODESIGNING_FOLDER_PATH/help"
          cp -R "$src" "$CODESIGNING_FOLDER_PATH/help"
        basedOnDependencyAnalysis: false
        showEnvVars: false
      - name: Install Python
        script: |
          "$PROJECT_DIR/tools/install_python.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
    info:
      path: ChordNotepad/Info.plist
      properties:
        CFBundleDisplayName: Chord Notepad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CNGitCommit: $(CN_GIT_COMMIT)
        CNBuildDate: $(CN_BUILD_DATE)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        # The Diagnostics folder and the songs saved there in the Files app;
        # songs opened from Files are opened in place (docs/IOS.md, "Files").
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Plain text opens in Chord Notepad from Files and other apps' Open in…
        # (an Alternate handler: never the default for .txt).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Song
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tibich.chordnotepad
        PRODUCT_NAME: ChordNotepad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Python.framework and the module frameworks sit in Frameworks/.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  ChordNotepadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChordNotepadTests
    dependencies:
      - target: ChordNotepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tibich.chordnotepad.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ChordNotepad:
    build:
      targets:
        ChordNotepad: all
        ChordNotepadTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChordNotepadTests
    archive:
      config: Release
