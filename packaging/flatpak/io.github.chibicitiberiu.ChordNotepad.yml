app-id: io.github.chibicitiberiu.ChordNotepad
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: chord-notepad

finish-args:
  # Tk only speaks X11 (XWayland on Wayland sessions)
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  # The built-in help is served on 127.0.0.1 and opened in the host browser,
  # which can only reach the sandbox's loopback with a shared network
  # namespace. The app itself makes no internet connections.
  - --share=network
  # No --filesystem: files are opened and saved through the FileChooser portal.

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # The runtime's Python has no tkinter, so build Tcl/Tk and the _tkinter
  # extension from the CPython release that matches the runtime's Python.
  - name: tcl
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --disable-zipfs
    post-install:
      - chmod 755 /app/lib/libtcl*.so
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl9.0.3-src.tar.gz
        sha256: 2537ba0c86112c8c953f7c09d33f134dd45c0fb3a71f2d7f7691fd301d2c33a6

  - name: tk
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --disable-zipfs
    post-install:
      - chmod 755 /app/lib/libtcl*tk*.so
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tk9.0.3-src.tar.gz
        sha256: bf344efadb618babb7933f69275620f72454d1c8220130da93e3f7feb0efbf9b

  - name: tkinter
    buildsystem: simple
    build-commands:
      - >-
        PYINC=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["include"])');
        EXT=$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))');
        SITE=${FLATPAK_DEST}/lib/python$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')/site-packages;
        mkdir -p "$SITE" &&
        gcc -shared -fPIC -O2 -DWITH_APPINIT=1
        -I"$PYINC" -I"$PYINC/internal" -IModules -I${FLATPAK_DEST}/include
        Modules/_tkinter.c Modules/tkappinit.c
        -L${FLATPAK_DEST}/lib -ltcl9.0 -ltcl9tk9.0
        -o "$SITE/_tkinter$EXT" &&
        cp -r Lib/tkinter "$SITE/" &&
        rm -rf "$SITE/tkinter/test"
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz
        sha256: 3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81

  - name: fluidsynth
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLIB_SUFFIX=
      - -Denable-alsa=OFF
      - -Denable-dbus=OFF
      - -Denable-jack=OFF
      - -Denable-ladspa=OFF
      - -Denable-libinstpatch=OFF
      - -Denable-oss=OFF
      - -Denable-pipewire=OFF
      - -Denable-portaudio=OFF
      - -Denable-pulseaudio=ON
      - -Denable-readline=OFF
      - -Denable-sdl3=OFF
      # Optional limiter/reverb engine; its CMake fetches three more repos at
      # configure time. The Windows build (FluidSynth 2.3) has none of it.
      - -Denable-signalsmith=OFF
      - -Denable-systemd=OFF
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/FluidSynth/fluidsynth/archive/refs/tags/v2.6.1.tar.gz
        sha256: 3d258a3bf97cc20c59eeebfe62c2432fae88adda74d3ad098681c76e0ebf446b
      # Git submodule the release tarball leaves out (pinned at v2.6.1)
      - type: archive
        url: https://github.com/kthohr/gcem/archive/012ae73c6d0a2cb09ffe86475f5c6fba3926e200.tar.gz
        sha256: 34ab0ee87a9eb26d3087fa9b49c2572ea8ee03db0c9705b83648301a3a3fc172
        dest: gcem

  # Generated by gen_python_deps.py
  - python3-deps.json

  - name: chord-notepad
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/share/chord-notepad
      - cp -r src VERSION ${FLATPAK_DEST}/share/chord-notepad/
      - find ${FLATPAK_DEST}/share/chord-notepad/src -name __pycache__ -prune -exec rm -rf {} +
      - cp -r resources ${FLATPAK_DEST}/share/chord-notepad/
      - rm -f ${FLATPAK_DEST}/share/chord-notepad/resources/*.ico
      - install -d ${FLATPAK_DEST}/share/chord-notepad/help/build
      # Sphinx output, built before flatpak-builder runs (make flatpak)
      - cp -r help/build/html ${FLATPAK_DEST}/share/chord-notepad/help/build/
      - cp -r examples ${FLATPAK_DEST}/share/chord-notepad/
      - install -Dm755 packaging/flatpak/chord-notepad.sh ${FLATPAK_DEST}/bin/chord-notepad
      - install -Dm644 resources/chord-notepad-icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 packaging/linux/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/linux/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
      - install -Dm644 resources/soundfont/GeneralUser-GS.LICENSE.txt ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/GeneralUser-GS.LICENSE.txt
      - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID} ADDITIONAL-TERMS.txt ARTWORK-TERMS.txt
      # Every bundled component's licence (also in the app: Help > Open Source Licences)
      - cp -r resources/licenses ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/components
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .tools
          - build
          - dist
          - dist-store
          - build-store
          - packaging/flatpak/.flatpak-builder
          - packaging/flatpak/build-dir
          - packaging/flatpak/repo
          - packaging/store/out
          - node_modules
          - tests
