[pytest]
# The core (chordnotepad), the desktop app (chordnotepad_desktop) and the Android
# glue (chordnotepad_android), imported by their package names. Child
# interpreters the tests start put the folders on sys.path themselves.
pythonpath = core desktop android/app/src/main/python
# pytest-qt is registered by tests/conftest.py, and only when PySide6 imports,
# so the rest of the suite runs on a machine without Qt.
addopts = -p no:pytest-qt
